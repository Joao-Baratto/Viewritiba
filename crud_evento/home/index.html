<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Viewritiba | Explore Curitiba</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/lista_eventos.css?v=1">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/cabecalho.css?v=3">
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <h1>Viewritiba</h1>
            <button id="logoff" class="btn-outline">
                Sair
            </button>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <div class="search-header">
                <h2>Explore o melhor de Curitiba!</h2>
                <p>
                    Descubra experiências únicas, explore novos
                    lugares e aproveite tudo o que Curitiba
                    tem a oferecer.
                </p>
            </div>

            <div class="search-area">
                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Buscar por título, descrição, local ou organizador"
                >

                <select id="filtro_categoria">
                    <option value="">
                        Todas as categorias
                    </option>
                </select>

                <input
                    type="date"
                    id="filtro_data"
                >

                <button id="buscar">
                    Buscar
                </button>

                <button
                    id="filtro_apagar"
                    type="button"
                >
                    Limpar filtros
                </button>
            </div>

            <div class="actions">
                <button
                    id="novo"
                    class="btn-primary"
                >
                    Criar novo evento
                </button>
            </div>
        </section>

        <section class="events-section">
            <div class="section-header">
                <div>
                    <h2>Explore os eventos</h2>
                </div>
            </div>
            <div id="lista"></div>
        </section>
    </main>

    <script src="../js/index.js"></script>
    <script src="../js/valida_sessao.js"></script>
</body>
</html>
