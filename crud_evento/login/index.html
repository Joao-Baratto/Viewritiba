<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="login.css">
</head>

<body>

    <h1>Login</h1>

    <form id="formLogin">

        <label for="usuario">E-mail:</label>
        <input
            type="email"
            id="usuario"
            name="email"
            required
        >

        <br><br>

        <label for="senha">Senha:</label>
        <input
            type="password"
            id="senha"
            name="senha"
            required
        >

        <br><br>

        <button type="button" id="enviar">
            Login
        </button>

    </form>

    <script src="../js/valida_login.js"></script>

</body>
</html>
