<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alterar comentário - Viewritiba</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&family=Domine:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="comentarios.css?v=3">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/cabecalho.css?v=5">
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <a class="brand-link" id="logo" href="#">
                <h1>Viewritiba</h1>
            </a>
            <nav class="header-nav" id="menu_participante" data-painel="../../crud_participante/home/painel.html" aria-label="Navegação principal" hidden>
                <a href="../../crud_participante/home/painel.html" class="nav-link">Home</a>
                <a href="../../crud_participante/home/explorar.html" class="nav-link">Explorar</a>
                <a href="../../crud_participante/home/eventos.html" class="nav-link">Eventos</a>
                <a href="../../favoritos/favoritos.html" class="nav-link">Favoritos</a>
                <a href="../../crud_participante/home/perfil_participante.html" class="nav-link">Meu perfil</a>
                <a href="#" class="nav-link" onclick="deslogar(); return false;">Sair</a>
            </nav>
            <nav class="header-nav" id="menu_organizador" data-painel="../../crud_organizador/home/painel.html" aria-label="Navegação principal" hidden>
                <a href="../../crud_evento/home/index.html" class="nav-link">Meus eventos</a>
                <a href="../../crud_organizador/home/perfil_organizador.html" class="nav-link">Meu perfil</a>
                <a href="#" class="nav-link" onclick="deslogar(); return false;">Sair</a>
            </nav>
        </div>
    </header>
    <main class="page-main">
        <section class="comments-shell">
            <div class="comments-header">
                <button type="button" id="btn_voltar" class="btn-primary">← Voltar</button>
                <h2>Comentário</h2>
            </div>
            <form id="form_alterar_comentario" class="composer">
                <div class="composer-header">
                    <h3>Editar comentário</h3>
                </div>
                <div class="composer-row">
                    <textarea id="novo_comentario" rows="6" required placeholder="Digite um comentário..."></textarea>
                </div>
                <div class="composer-actions">
                    <div class="input-group select-group">
                        <label for="nova_nota">Nota</label>
                        <select id="nova_nota" required>
                            <option value="">-</option>
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>
                        </select>
                    </div>
                </div>
                <br>
                <button type="submit" id="botao_alterar_comentario" class="btn-primary">Salvar alterações</button>
            </form>
        </section>
    </main>
    <script src="../js/comentario_alterar.js?v=3"></script>
</body>
</html>
