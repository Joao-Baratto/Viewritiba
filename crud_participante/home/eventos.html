    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<body>
    <header class="page-header">
        <div class="header-content">
            <a class="brand-link" href="../../crud_participante/home/painel.html">
                <h1>Viewritiba</h1>
            </a>
            <nav class="header-nav" aria-label="Navegação principal">
                <a href="../../crud_participante/home/painel.html" class="nav-link">Início</a>
                <a href="../../crud_participante/home/explorar.html" class="nav-link">Recomendados</a>
                <a href="../../crud_participante/home/eventos.html" class="nav-link active" aria-current="page">Eventos</a>
                <a href="../../favoritos/favoritos.html" class="nav-link">Favoritos</a>

                <a href="#" id="logoff" class="nav-link">Sair</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="search-section">
            <div class="search-header">
                <h2>Encontre eventos em Curitiba!</h2>
                <p>Pesquise eventos de todos os organizadores, descubra novas experiências e encontre atividades de acordo com seus interesses.</p>
            </div>

            <div class="search-area">
                <input
                    type="text"
                    id="pesquisa"
                    placeholder="Buscar por título, descrição, local ou organizador"
                >

                <div id="filtro_categorias"></div>

                <input type="date" id="filtro_data">

                <button id="buscar">Buscar</button>

                <button id="filtro_apagar" type="button">
                    Limpar filtros
                </button>
            </div>
        </section>

        <section class="events-section">
            <div class="section-header">
                <div>
                    <h2>Eventos disponíveis</h2>
                </div>
            </div>
            <div id="lista"></div>
        </section>
    </main>
<script src="../../crud_evento/js/icones.js?v=10"></script>
