<!DOCTYPE html>
<html lang="pt-br">
<head>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventos | Viewritiba</title>

    <link rel="stylesheet" href="../../crud_evento/css/style.css">
    <link rel="stylesheet" href="../../compartilhamento_eventos/compartilhar-modal.css">
</head>
</head>
<body>
    <header class="page-header">
        <div class="header-content">
            <a href="painel.html" class="brand-link"><h1>Viewritiba</h1></a>
            <button id="logoff" class="btn-outline">Sair</button>
        </div>
    </header>
    <main class="container">
        <section class="search-section">
            <div class="search-header">
                <h2>Encontre eventos em Curitiba!</h2>
                <p>Pesquise eventos de todos os organizadores, descubra novas experiências e encontre atividades de acordo com seus interesses.</p>
            </div>
            <div class="search-area">
                <input type="text" id="pesquisa" placeholder="Digite o nome do evento">
                <select id="filtro_categoria">
                    <option value=""> - </option>
                </select>
                <input type="date" id="filtro_data">
                <button id="buscar">Buscar</button>
                <button id="filtro_apagar" type="button">Limpar filtros</button>
            </div>
        </section>
        <section class="events-section">
            <div class="section-header">
                <div><h2>Eventos disponíveis</h2></div>
            </div>
            <div id="lista"></div>
        </section>
    </main>
    <script src="../../compartilhamento_eventos/compartilhar.js?v=1"></script>
<script src="../js/eventos.js?v=2"></script>
</body>
</html>
