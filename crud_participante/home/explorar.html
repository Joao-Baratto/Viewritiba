    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../crud_organizador/home/painel.css?v=2">

<body>
    <header class="page-header">
        <div class="header-content">
            <a class="brand-link" href="../../crud_participante/home/painel.html">
                <h1>Viewritiba</h1>
            </a>
            <nav class="header-nav" aria-label="Navegação principal">
                <a href="../../crud_participante/home/painel.html" class="nav-link">Início</a>
                <a href="../../crud_participante/home/explorar.html" class="nav-link active" aria-current="page">Recomendados</a>
                <a href="../../crud_participante/home/eventos.html" class="nav-link">Eventos</a>
                <a href="../../favoritos/favoritos.html" class="nav-link">Favoritos</a>
                <a href="../../crud_participante/home/perfil_participante.html" class="nav-link">Meu perfil</a>
                <a href="#" id="logoff" class="nav-link">Sair</a>
            </nav>
        </div>
    </header>

    <main class="panel-main explorar-main">
        <div class="explorar-topo">
            <section class="panel-welcome">
                <p class="panel-eyebrow">Feito para você</p>
                <h2 id="titulo_explorar"></h2>
                <p id="mensagem_explorar"></p>
                <!-- Com recomendações: só este link discreto, no lugar do card -->
                <a id="link_todos_eventos" class="explorar-link-todos" href="eventos.html" hidden>Ver todos os eventos <span aria-hidden="true">→</span></a>
            </section>

            <!-- Sem recomendações: card de chamada para a tela de eventos -->
            <a id="card_explorar" class="panel-card panel-card-events" href="eventos.html" hidden>
                <span class="panel-card-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
                </span>
                <span class="panel-card-label">A cidade está acontecendo</span>
                <h3>Explorar eventos</h3>
                <p>Encontre experiências e atividades em Curitiba e região.</p>
                <span class="panel-card-link">Ver eventos <span aria-hidden="true">→</span></span>
            </a>
        </div>

        <section class="explorar-eventos">
            <div id="lista-explorar"></div>
        </section>
